<div class="forge-container" id="container_forge_mixin">
    <input type="file" id="imageInput_forge_mixin" class="forge-file-upload">
    <div id="imageContainer_forge_mixin" class="forge-image-container">
        <div id="uploadHint_forge_mixin">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" class="forge-upload-hint">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="grey" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="forge-upload-hint">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <img id="image_forge_mixin" draggable="false" class="forge-image">
        <canvas id="drawingCanvas_forge_mixin" class="forge-drawing-canvas" style="position:absolute;top:0;left:0;"
            width="1" height="1"></canvas>
        <div class="forge-toolbar" id="toolbar_forge_mixin" title="[Shift] for Eraser">
            <div class="forge-toolbar-box-a">
                <button id="maxButton_forge_mixin" class="forge-btn" title="Maximize [F]">⛶</button>
                <button id="minButton_forge_mixin" class="forge-btn" title="Minimize [F]">➖</button>
                <button id="uploadButton_forge_mixin" class="forge-btn" title="Upload">📂</button>
                <button id="removeButton_forge_mixin" class="forge-btn" title="Remove">🗑️</button>
                <button id="centerButton_forge_mixin" class="forge-btn" title="Center Position [R]">✠</button>
                <button id="resetButton_forge_mixin" class="forge-btn" title="Reset [Ctrl + X]">🔄</button>
                <button id="undoButton_forge_mixin" class="forge-btn" title="Undo [Ctrl + Z]">↩️</button>
                <button id="redoButton_forge_mixin" class="forge-btn" title="Redo [Ctrl + Y]">↪️</button>
                <span class="forge-toolbar-hint">Hold Ctrl + Click for straight line</span>
            </div>
            <div class="forge-toolbar-box-b">
                <div class="forge-color-picker-block" title="Fill Color [E]" id="scribbleColorBlock_forge_mixin">
                    <input type="color" id="scribbleColor_forge_mixin" class="forge-toolbar-color" value="#000000">
                </div>
                <div class="forge-color-picker-block" title="Stroke Color [Shift + E]" id="strokeColorBlock_forge_mixin">
                    <input type="color" id="strokeColor_forge_mixin" class="forge-toolbar-color" value="#ffffff">
                </div>
                <button id="brushShapeButton_forge_mixin" class="forge-btn" title="Cycle Brush Shape: Circle/Rectangle/Triangle [B]" style="font-size: 20px; width: 40px; height: 40px;">○</button>
                <button id="scatterButton_forge_mixin" class="forge-btn" title="Toggle Scatter Brush [N] — random offset & size per stamp" style="font-size: 16px; width: 40px; height: 40px;">⋯</button>
                <div class="forge-shape-picker-container">
                    <button id="shapePickerButton_forge_mixin" class="forge-btn" title="Select Custom Shape [G]" style="font-size: 18px; width: 40px; height: 40px;">▲</button>
                    <div id="shapePalette_forge_mixin" class="forge-shape-palette" style="display: none;"></div>
                </div>
                <button id="shapeFillModeButton_forge_mixin" class="forge-btn" title="Toggle Fill/Outline Mode [H]" style="font-size: 20px; width: 40px; height: 40px;">■</button>
                <div class="forge-range-row" title="adjust with [W] + [Scroll Wheel]"
                    id="scribbleWidthBlock_forge_mixin">
                    <div id="widthLabel_forge_mixin" class="forge-toolbar-label">Brush Width</div>
                    <input type="range" id="scribbleWidth_forge_mixin" class="forge-toolbar-range" min="1" max="250"
                        value="25">
                </div>
                <button id="sizeLinkButton_forge_mixin" class="forge-btn" title="Link/Unlink Width and Height [L]" style="font-size: 20px; width: 40px; height: 40px;">🔗</button>
                <button id="equalizeButton_forge_mixin" class="forge-btn" title="Equalize Width and Height [=]" style="font-size: 16px; width: 40px; height: 40px;">⊞</button>
                <div class="forge-range-row" title="adjust with [Q] + [Scroll Wheel]&#10;Control vertical dimension independently"
                    id="scribbleHeightBlock_forge_mixin">
                    <div id="heightLabel_forge_mixin" class="forge-toolbar-label">Brush Height</div>
                    <input type="range" id="scribbleHeight_forge_mixin" class="forge-toolbar-range" min="1" max="250"
                        value="25">
                </div>
                <div class="forge-range-row" title="adjust with [A] + [Scroll Wheel]&#10;function as eraser if 0"
                    id="scribbleAlphaBlock_forge_mixin">
                    <div id="alphaLabel_forge_mixin" class="forge-toolbar-label">Brush Opacity</div>
                    <input type="range" id="scribbleAlpha_forge_mixin" class="forge-toolbar-range" min="0" max="100"
                        value="100">
                </div>
                <div class="forge-range-row" title="adjust with [S] + [Scroll Wheel]"
                    id="scribbleSoftnessBlock_forge_mixin">
                    <div id="softnessLabel_forge_mixin" class="forge-toolbar-label">Brush Softness</div>
                    <input type="range" id="scribbleSoftness_forge_mixin" class="forge-toolbar-range" min="0" max="100"
                        value="0">
                </div>
                <div class="forge-range-row" title="adjust with [D] + [Scroll Wheel]"
                    id="scribbleRotationBlock_forge_mixin">
                    <div id="rotationLabel_forge_mixin" class="forge-toolbar-label" style="cursor: pointer;">Brush Rotation</div>
                    <input type="range" id="scribbleRotation_forge_mixin" class="forge-toolbar-range" min="0" max="360"
                        value="0" step="5" list="rotationSnaps_forge_mixin">
                    <datalist id="rotationSnaps_forge_mixin">
                        <option value="0"></option>
                        <option value="45"></option>
                        <option value="90"></option>
                        <option value="135"></option>
                        <option value="180"></option>
                        <option value="225"></option>
                        <option value="270"></option>
                        <option value="315"></option>
                        <option value="360"></option>
                    </datalist>
                </div>
                <div class="forge-range-row" title="Stroke/outline width for shapes"
                    id="strokeWidthBlock_forge_mixin">
                    <div id="strokeWidthLabel_forge_mixin" class="forge-toolbar-label">Stroke Width</div>
                    <input type="range" id="strokeWidth_forge_mixin" class="forge-toolbar-range" min="0" max="5"
                        value="0">
                </div>
            </div>
        </div>
        <div id="scribbleIndicator_forge_mixin" class="forge-scribble-indicator"></div>
    </div>
</div>
